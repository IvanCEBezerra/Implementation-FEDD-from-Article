[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedd"
version = "0.1.0"
description = "FEDD generators - AR time series with drifts"
requires-python = ">=3.8"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fedd*"]
